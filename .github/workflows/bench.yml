name: Cite 3 benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = quick check, run = full benchmark"
        type: choice
        default: smoke
        options:
          - smoke
          - run
      n_per_type:
        description: "Cases per type (run only, max 60)"
        default: "40"

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test
      - name: Run
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          N_PER_TYPE: ${{ inputs.n_per_type }}
        run: node bench-run.mjs "${{ inputs.mode }}"
      - name: Show summary
        if: always()
        run: |
          for f in smoke.md summary.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Save results to the repository
        if: ${{ inputs.mode == 'run' && success() }}
        run: |
          git config user.name "cite3-bot"
          git config user.email "cite3-bot@users.noreply.github.com"
          git add results.json summary.md cases.json
          git commit -m "Benchmark results" || echo "nothing to commit"
          git push
